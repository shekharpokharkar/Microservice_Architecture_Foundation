spring.application.name=EmployeeService
spring.datasource.url=jdbc:mysql://localhost:3306/seleniumexpress_microservice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA & Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update     
spring.jpa.show-sql=true                
spring.jpa.properties.hibernate.format_sql=true

spring.cloud.openfeign.circuitbreaker.enabled=true

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

server.port=0
server.servlet.context-path=/employee-app/api

adressservice.base.url=http://localhost:8081/address-app/api



eureka.client.service-url.defaultZone=http://localhost:5000/eureka