spring.application.name=employee-service
spring.datasource.url=jdbc:mysql://localhost:3306/seleniumexpress_microservice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA & Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update     
spring.jpa.show-sql=true                
spring.jpa.properties.hibernate.format_sql=true

spring.cloud.openfeign.circuitbreaker.enabled=true

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

server.port=0
spring.zipkin.base-url=http://localhost:9411

adressservice.base.url=http://localhost:8081/address-app/api
eureka.client.service-url.defaultZone=http://localhost:5000/eureka


#resilience4j.circuitbreaker.instances.employees.minimum-number-of-calls=10
#resilience4j.circuitbreaker.instances.employees.allow-health-indicator-to-fail=true
#resilience4j.circuitbreaker.instances.employees.failure-rate-threshold=50
#resilience4j.circuitbreaker.instances.employees.wait-duration-in-open-state=3000
#resilience4j.circuitbreaker.instances.employees.sliding-window-size=10
#resilience4j.circuitbreaker.instances.employees.permitted-number-of-calls-in-half-open-state=3



# IMPORTANT: Use name "addressservice" to match Feign client
resilience4j.circuitbreaker.instances.addressservice.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.addressservice.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.addressservice.wait-duration-in-open-state=3s
resilience4j.circuitbreaker.instances.addressservice.sliding-window-size=10
resilience4j.circuitbreaker.instances.addressservice.permitted-number-of-calls-in-half-open-state=3


management.tracing.enabled=true
management.tracing.sampling.probability=1.0

logging.pattern.level: "%5p [${spring.application.name:},traceId=%X{traceId},spanId=%X{spanId}]"













