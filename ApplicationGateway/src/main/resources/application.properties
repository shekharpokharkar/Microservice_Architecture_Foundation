spring.application.name=application-gateway

server.port=8585

spring.zipkin.base-url=http://localhost:9411
eureka.client.service-url.defaultZone=http://localhost:5000/eureka

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

spring.cloud.gateway.routes[0].id=department-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/department-service/**
spring.cloud.gateway.routes[0].uri=lb://DEPARTMENTSERVICE
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=address-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/address-service/**
spring.cloud.gateway.routes[1].uri=lb://ADDRESS-SERVICE
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1


spring.cloud.gateway.routes[2].id=employee-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.routes[2].uri=lb://EMPLOYEE-SERVICE
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[3].id=organisation-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/organisation-service/**
spring.cloud.gateway.routes[3].uri=lb://ORGANISATION-SERVICE
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

management.tracing.enabled=true
management.tracing.sampling.probability=1.0

logging.pattern.level: "%5p [${spring.application.name:},traceId=%X{traceId},spanId=%X{spanId}]"






