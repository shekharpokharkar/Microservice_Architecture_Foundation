spring.application.name=OrganisationDetails
server.port=0

server.servlet.context-path=/organisationDetails

eureka.client.service-url.defaultZone=http://localhost:5000/eureka
resilience4j.circuitbreaker.instances.employeeservice.register-health-indicator=true

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always


# Global configuration (default settings)
# Config for circuit breaker instance 'org-details'

resilience4j.circuitbreaker.instances.Orgshekhar.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.Orgshekhar.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.Orgshekhar.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.Orgshekhar.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.Orgshekhar.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.Orgshekhar.timeout-duration=4s
resilience4j.timelimiter.instances.Orgshekhar.cancel-running-future=true

spring.cloud.openfeign.circuitbreaker.enabled=true
