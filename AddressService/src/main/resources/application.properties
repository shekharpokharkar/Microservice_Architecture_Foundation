spring.application.name=AddressService
spring.datasource.url=jdbc:mysql://localhost:3306/seleniumexpress_microservice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
server.port=8083
server.servlet.context-path=/address-app/api

eureka.client.service-url.defaultZone=http://localhost:5000/eureka

eureka.instance.metadata-map.context-path=/address-app/api