# -----------------------------
# Application Identity
# -----------------------------
spring.application.name=EmployeeService_openFeign

# -----------------------------
# DataSource Configuration
# -----------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/seleniumexpress_microservice
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------
# JPA & Hibernate Settings
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.example.demo.feign=DEBUG
logging.level.feign=DEBUG

addressservice.base.url=http://localhost:8081/address-app/api
# -----------------------------
# Server Configuration
# -----------------------------
server.port=0
server.servlet.context-path=/employee-app/api

# -----------------------------
# Ribbon Client Configuration
# -----------------------------
addressservice.ribbon.listOfServers=http://localhost:8081,http://localhost:8082
